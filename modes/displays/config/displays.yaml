#config_version=6

#This mode manages centralized handling for all display updates during a game.
mode:
  start_events: reset_complete
  events_when_started: displays_init_done
  priority: 5
  game_mode: false

event_player:
  ball_will_start{player==1}:
    - player_1_active

  ball_will_start{player==2}:
    - player_2_active

segment_display_player:
  #Add players to displays when they are added to the game.
  player_added{num==1}:
    display_p1:
      text: "{players[0].score:d}"
      key: scores
    display_p2:
      text: ""
      key: scores
    display_credit:
      text: "{(machine.credits_whole_num):d}"
      key: scores
    display_tilt:
      text: "{(current_player.tilt_warnings):d}W"
  player_added{num==2}:
    display_p2:
      text: "{players[1].score:d}"
      key: scores

  tilt_warning:
    display_tilt:
      text: "{(current_player.tilt_warnings):d}W"
  tilt:
    display_tilt:
      text: "XX"

  #Remove scores when game ended.
  game_ended:
    display_p1:
      action: remove
      key: scores
    display_p2:
      action: remove
      key: scores
    display_credit:
      action: remove
      key: scores

  #Update scores when points are collected, and terminate flashing.
  player_score{player_num==1 and change>0}:
    display_p1:
      text: "{players[0].score:d}"
      action: no_flash
      key: scores
  player_score{player_num==2 and change>0}:
    display_p2:
      text: "{players[1].score:d}"
      action: no_flash
      key: scores

  #Update displays when turns start.
  #player_turn_started{number==1}:
  ball_will_start{player==1}:
    display_p1:
      text: "{players[0].score:d}"
      action: flash
      key: scores
    display_tilt:
      text: "{(current_player.tilt_warnings):d}W"
  ball_will_start{player==2}:
    display_p2:
      text: "{players[1].score:d}"
      action: flash
      key: scores
    display_tilt:
      text: "{(current_player.tilt_warnings):d}W"

widgets:
  tilt_warning_widget:
    - type: text
      text: "Warning!"
      font_name: rock
      font_size: 55
      bold: true
      expire: 2s
      anchor_x: center
      anchor_y: center
      x: 400
      y: 240
      z: 300
      color: 74331b
    - type: rectangle
      anchor_x: center
      anchor_y: center
      x: 400
      y: 240
      z: 290
      width: 255
      height: 85
      color: black
      opacity: .9
      corner_radius: 10
      expire: 2s
  tilt_widget:
    - type: text
      text: "TILT"
      font_name: rock
      font_size: 55
      bold: true
      expire: 2s
      anchor_x: center
      anchor_y: center
      x: 400
      y: 240
      z: 300
      color: 74331b
    - type: rectangle
      anchor_x: center
      anchor_y: center
      x: 400
      y: 240
      z: 290
      width: 180
      height: 85
      color: black
      opacity: .9
      corner_radius: 10
      expire: 2s
  w_ball1:
    - type: image
      image: RedBulbBig
      x: 272
      y: 123
      z: 180
  w_ball2:
    - type: image
      image: RedBulbBig
      x: 334
      y: 124
      z: 180
  w_ball3:
    - type: image
      image: RedBulbBig
      x: 402
      y: 125
      z: 180
  w_ball4:
    - type: image
      image: RedBulbBig
      x: 462
      y: 127
      z: 180
  w_ball5:
    - type: image
      image: RedBulbBig
      x: 525
      y: 126
      z: 180
  w_p1:
    - type: image
      image: RedBulbBig
      x: 130
      y: 335
      z: 180
      opacity: 0
      animations:
        player_1_active:
          property: opacity
          value: 1
          duration: 10ms
        player_2_active:
          property: opacity
          value: 0
          duration: 50ms
  w_p2:
    - type: image
      image: RedBulbBig
      x: 434
      y: 335
      z: 180
      opacity: 0
      animations:
        player_2_active:
          property: opacity
          value: 1
          duration: 10ms
        player_1_active:
          property: opacity
          value: 0
          duration: 50ms

widget_player:
  tilt_warning:
    tilt_warning_widget:
      slide: screen_segement_display
      priority: 10
  tilt:
    tilt_widget:
      slide: screen_segement_display
      priority: 10
  mode_base_started{ball==1}:
    w_ball1:
      slide: screen_segement_display
      priority: 10
  mode_base_started{ball==2}:
    w_ball1:
      slide: screen_segement_display
      priority: 10
      action: remove
    w_ball2:
      slide: screen_segement_display
      priority: 10
  mode_base_started{ball==3}:
    w_ball2:
      slide: screen_segement_display
      priority: 10
      action: remove
    w_ball3:
      slide: screen_segement_display
      priority: 10
  mode_base_started{ball==4}:
    w_ball3:
      slide: screen_segement_display
      priority: 10
      action: remove
    w_ball4:
      slide: screen_segement_display
      priority: 10
  mode_base_started{ball==5}:
    w_ball4:
      slide: screen_segement_display
      priority: 10
      action: remove
    w_ball5:
      slide: screen_segement_display
      priority: 10
  mode_game_started:
    w_p1:
      slide: screen_segement_display
      priority: 10
      action: add
    w_p2:
      slide: screen_segement_display
      priority: 10
      action: add
  game_will_end:
    w_ball5:
      slide: screen_segement_display
      priority: 10
      action: remove